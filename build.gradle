plugins {
    id 'fabric-loom' version '1.9.2'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Sodium 0.5.13 for 1.20.1 (the branch this mod mixins into).
    // Compile only: Sodium must be installed at runtime by the user.
    modCompileOnly "maven.modrinth:sodium:mc1.20.1-0.5.13-fabric"

    // Uncomment this line when testing inside a dev environment:
    // modRuntimeOnly "maven.modrinth:sodium:mc1.20.1-0.5.13-fabric"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 17
}

jar {
    from('LICENSE')
}
